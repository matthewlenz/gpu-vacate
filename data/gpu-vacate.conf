# gpu-vacate settings (shell syntax). Read by gpu-vacate and its boot/shutdown service.

# The GPU the desktop moves to. Empty: the integrated GPU, found automatically.
# Otherwise a PCI ID (vendor:device, e.g. 1002:164e) or a PCI address (e.g.
# 0000:5c:00.0); `gpu-vacate status` shows both for each GPU. The ID is the safer
# choice: addresses can shift when a card is added or removed.
DESKTOP_GPU=

# Monitor input codes (DDC/CI VCP 0x60, hex like 0x0f) for the cable from each GPU.
# Empty: switch the input by hand. `gpu-vacate inputs` reads the current code.
# The MCCS standard says DisplayPort-1 0x0f, DisplayPort-2 0x10, HDMI-1 0x11,
# HDMI-2 0x12, but monitors differ (a Samsung Odyssey G9 G91SD uses 0x05 for HDMI).
INPUT_DGPU=
INPUT_IGPU=

# Switch the monitor to the boot GPU's input at boot and shutdown, so the firmware,
# boot loader and other operating systems are visible (yes/no). Needs the input codes.
FIRMWARE_INPUT=yes
